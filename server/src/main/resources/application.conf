ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [org.example.project.ApplicationKt.module]
    }
}

database {
    url = "jdbc:postgresql://localhost:5434/erp"
    url = ${?ERP_DB_URL}
    user = "erp"
    user = ${?ERP_DB_USER}
    password = "erp"
    password = ${?ERP_DB_PASSWORD}
}

session {
    ttlMinutes = 480
    cookieName = "erp_session"
}

security {
    allowedOrigins = "http://localhost:8080,http://localhost:8081,http://localhost:8090,http://localhost:8091"
    allowedOrigins = ${?ERP_ALLOWED_ORIGINS}
    cookieSecure = false
    cookieSecure = ${?ERP_COOKIE_SECURE}
}

storage {
    path = "./.local/storage"
    path = ${?ERP_STORAGE_PATH}
}

assistant {
    enabled = true
    enabled = ${?ERP_ASSISTANT_ENABLED}
    baseUrl = "http://127.0.0.1:11434"
    baseUrl = ${?ERP_ASSISTANT_BASE_URL}
    model = "qwen3.5:9b"
    model = ${?ERP_ASSISTANT_MODEL}
    timeoutSeconds = 120
    timeoutSeconds = ${?ERP_ASSISTANT_TIMEOUT_SECONDS}
}
