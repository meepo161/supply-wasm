ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [org.example.project.ApplicationKt.module]
    }
}

database {
    url = "jdbc:postgresql://localhost:5433/erp"
    url = ${?ERP_DB_URL}
    user = "erp"
    user = ${?ERP_DB_USER}
    password = "erp"
    password = ${?ERP_DB_PASSWORD}
}

session {
    ttlMinutes = 480
    cookieName = "erp_session"
}

security {
    allowedOrigins = "http://localhost:8080,http://localhost:8081"
    allowedOrigins = ${?ERP_ALLOWED_ORIGINS}
    cookieSecure = false
    cookieSecure = ${?ERP_COOKIE_SECURE}
}

storage {
    path = "./.local/storage"
    path = ${?ERP_STORAGE_PATH}
}
