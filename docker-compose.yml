services:
  postgres:
    image: postgres:16
    container_name: erp-postgres
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: erp
    ports:
      - "5433:5432"
    volumes:
      - ./.local/postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U erp -d erp" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
